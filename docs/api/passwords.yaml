openapi: 3.1.0
info:
  title: BuildEstate password lifecycle API
  version: 1.0.0
  description: |
    Internal staff accounts only; no public registration or email dependency.
    Passwords contain 12 to 128 Unicode characters and are stored as Argon2id
    hashes. Setup links expire after 24 hours; recovery links after 30 minutes.
    Tokens are opaque, single use, and stored only as digests. A replacement
    revokes outstanding tokens of the same purpose. Successful completion
    atomically changes the hash, invalidates tokens and sessions, and audits
    secret-free metadata. Sign in again after completion.
servers:
  - url: /api/v1
paths:
  /auth/recovery-guidance:
    get:
      operationId: getRecoveryGuidance
      security: []
      responses:
        '200':
          description: Intentionally public company Administrator contact instructions; no account lookup.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: {type: string}
                  data:
                    type: object
                    required: [instructions, contactLabel]
                    properties:
                      instructions: {type: string}
                      contactLabel: {type: string}
        '503': {$ref: '#/components/responses/Error'}
  /auth/reset-password:
    post:
      operationId: completePasswordSetupOrRecovery
      security: []
      description: |
        Token determines setup or recovery. Links carry the token in the login
        URL fragment, never a query parameter. The client must remove that
        fragment immediately and retain the token only in transient memory.
        Unknown, expired, revoked and consumed tokens return the same error
        and require a replacement after Administrator identity verification.
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: {type: string, writeOnly: true}
                newPassword: {$ref: '#/components/schemas/Password'}
      responses:
        '200': {$ref: '#/components/responses/Changed'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422':
          description: INVALID_RESET_TOKEN (unknown, expired, revoked or consumed) or VALIDATION_FAILED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/change-password:
    post:
      operationId: changeOwnPassword
      security: [{session: []}]
      description: Requires an active non-setup session and verification of the current password.
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string, maxLength: 128, writeOnly: true}
                newPassword: {$ref: '#/components/schemas/Password'}
      responses:
        '200': {$ref: '#/components/responses/Changed'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /users/{id}/password-reset:
    post:
      operationId: issueStaffPasswordLink
      security: [{session: []}]
      description: |
        Administrator only, after trusted-channel identity verification. Setup
        purpose requires a setup-required account. Return the link once and
        deliver privately; never log it or persist it in a retry response.
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
        - name: id
          in: path
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, purpose, identityVerified, reason]
              properties:
                version: {type: integer, minimum: 1}
                purpose: {type: string, enum: [setup, recovery]}
                identityVerified: {type: boolean, const: true}
                reason: {type: string, minLength: 1}
      responses:
        '200':
          description: One-time delivery response, no-store; resetLink contains a fragment token.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: {type: string}
                  data:
                    type: object
                    required: [userId, resetLink, expiresAt]
                    properties:
                      userId: {type: string}
                      resetLink: {type: string}
                      expiresAt: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: buildestate_session}
  parameters:
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: |
        Unique per intentional mutation. Committed issuance replay is rejected
        with 409 IDEMPOTENCY_MISMATCH rather than persisting a secret response.
        Completed reset tokens remain invalid on replay; changed sessions are
        revoked. Never automatically replay credential requests.
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
      description: Signed buildestate_csrf cookie value bound to the presented session, or anonymous binding.
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string}
      description: Exact application scheme and host including port.
  schemas:
    Password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
    ErrorEnvelope:
      type: object
      required: [error, requestId]
      properties:
        requestId: {type: string}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
  responses:
    Changed:
      description: Password committed; all prior sessions invalidated. Sign in afresh.
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              requestId: {type: string}
              data:
                type: object
                required: [passwordChanged, signInRequired]
                properties:
                  passwordChanged: {type: boolean, const: true}
                  signInRequired: {type: boolean, const: true}
    Error:
      description: Safe error envelope; no passwords, token values or internal storage details.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
